<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2><a href="./../page_principal/index.html">home</a></h2>
    <fieldset class="fieldset">
        <legend>Personal Information</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
    </fieldset>
    <fieldset class="fieldset">
        <legend>Address Information</legend>
        <label for="street">Street:</label>
        <input type="text" id="street" name="street">
        <label for="city">City:</label>
        <input type="text" id="city" name="city">
        <label for="postalCode">Postal Code:</label>
        <input type="text" id="postalCode" name="postalCode">
    </fieldset>
    <fieldset class="fieldset">
        <legend>date information</legend>
        <label for="date">Date of Birth:</label>
        <input type="date" id="date" name="date">
        <label for="expeditionTime">Document Expedition Time:</label>
        <input type="time" id="expeditionTime" name="expeditionTime">
    </fieldset>
    <fieldset class="fieldset">
        <legend>Additional Information</legend>
        <label for="phone">Phone:</label>
        <input type="number" id="phone" name="phone">
        <label for="color">Favorite Color:</label>
        <input type="color" id="color" name="color" class="color">
        <label for="range">English Level:</label>
        <input type="range" id="range" name="range" min="0" max="100">
        <label for="animalPreference">Animal Preference:</label>
        <select name="animalPreference" id="animalPreference">
            <option value="dog">Dog</option>
            <option value="cat">Cat</option>
            <option value="bear">Bear</option>
            <option value="other">Other</option>
        </select>
    </fieldset>
    <button type="submit">Submit</button>
</body>
</html>
