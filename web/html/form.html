<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT LEARNING</title>
    <link rel="stylesheet" href="./../css/style.css">
    <link rel="stylesheet" href="./../css/form.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Glass+Antiqua&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Zen+Dots&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <a href="./index.html"><img src="/web/images/headphones-solid-full.svg" alt="logo" class="imgLogo"></a>
        </div>
        <nav>
            <ul class="nav">
                <li class="items"><a href="./index.html">HOME</a></li>
                <li class="items"><a href="./galery.html">GALERY</a></li>
                <li class="items"><a href="./modal.html">MODAL</a></li>
            </ul>
        </nav>
        <div class="socialMedia">
            <a href="https://www.facebook.com/" target="_blank"><img src="/web/images/facebook-brands-solid-full.svg" alt="Facebook" class="imgSocial"></a>
            <a href="https://discord.com/" target="_blank"><img src="/web/images/discord-brands-solid-full.svg" alt="Discord" class="imgSocial"></a>
            <a href="https://www.instagram.com/" target="_blank"><img src="/web/images/instagram-brands-solid-full.svg" alt="Instagram" class="imgSocial"></a>
        </div>
    </header>
    <main>
    <form action="">
        <h2><a href="./../page_principal/index.html">home</a></h2>
    <fieldset class="fieldset">
        <legend>Personal Information</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
    </fieldset>
    <fieldset class="fieldset">
        <legend>Address Information</legend>
        <label for="street">Street:</label>
        <input type="text" id="street" name="street">
        <label for="city">City:</label>
        <input type="text" id="city" name="city">
        <label for="postalCode">Postal Code:</label>
        <input type="text" id="postalCode" name="postalCode">
    </fieldset>
    <fieldset class="fieldset">
        <legend>date information</legend>
        <label for="date">Date of Birth:</label>
        <input type="date" id="date" name="date">
        <label for="expeditionTime">Document Expedition Time:</label>
        <input type="time" id="expeditionTime" name="expeditionTime">
    </fieldset>
    <fieldset class="fieldset">
        <legend>Additional Information</legend>
        <label for="phone">Phone:</label>
        <input type="number" id="phone" name="phone">
        <label for="color">Favorite Color:</label>
        <input type="color" id="color" name="color" class="color">
        <label for="range">English Level:</label>
        <input type="range" id="range" name="range" min="0" max="100">
        <label for="animalPreference">Animal Preference:</label>
        <select name="animalPreference" id="animalPreference">
            <option value="dog">Dog</option>
            <option value="cat">Cat</option>
            <option value="bear">Bear</option>
            <option value="other">Other</option>
        </select>
    </fieldset>
    </form>
    <button type="submit">Submit</button>
    <a class="homeLink" href="#top"><img src="/web/images/house-solid-full.svg" alt="home"></a>
    </main>
    <footer>
        <p class="font_footer">2023 BIT LEARNING. Derechos reservados.</p>
    </footer>
</body>
</html>
